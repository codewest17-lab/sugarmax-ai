<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in or sign up — SugarMax AI</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .auth-wrap { min-height:calc(100vh - 74px); display:flex; align-items:center; justify-content:center; padding:40px 20px; }
  .auth-card { max-width:420px; width:100%; }
  .tabs { display:flex; border:2px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; margin-bottom:28px; }
  .tab-btn { flex:1; padding:12px; background:var(--paper-raised); border:none; font-family:var(--font-label); font-weight:600; font-size:0.9rem; cursor:pointer; color:var(--ink-soft); }
  .tab-btn.active { background:var(--forest); color:var(--paper); }
  .oauth-row { display:flex; flex-direction:column; gap:12px; margin-bottom:24px; }
  .oauth-btn { display:flex; align-items:center; justify-content:center; gap:10px; padding:12px; border:2px solid var(--line); border-radius:var(--radius-sm); background:var(--paper-raised); cursor:pointer; font-family:var(--font-body); font-size:0.9rem; font-weight:500; }
  .divider-row { display:flex; align-items:center; gap:12px; margin:20px 0; color:var(--ink-soft); font-size:0.8rem; }
  .divider-row::before, .divider-row::after { content:""; flex:1; height:1px; background:var(--line-soft); }
  form.hidden { display:none; }
  .forgot-link { font-size:0.85rem; text-align:right; display:block; margin-top:-10px; margin-bottom:18px; text-decoration:none; color:var(--ink-soft); }
</style>
</head>
<body>
<div id="nav-root"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="tabs">
      <button class="tab-btn active" id="tab-signin" onclick="switchTab('signin')">Log in</button>
      <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Sign up</button>
    </div>

    <div id="alert-box"></div>

    <div class="oauth-row">
      <button class="oauth-btn" id="google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.94v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.94A9 9 0 0 0 0 9c0 1.45.35 2.83.94 4.03l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .94 4.97l3.01 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>
      <button class="oauth-btn" id="apple-btn">
        <svg width="16" height="18" viewBox="0 0 16 18" fill="currentColor"><path d="M13.2 9.5c0-2.1 1.7-3.1 1.8-3.2-1-1.4-2.5-1.6-3-1.6-1.3-.1-2.5.7-3.2.7-.7 0-1.7-.7-2.8-.7-1.4 0-2.8.8-3.5 2.1-1.5 2.6-.4 6.4 1.1 8.5.7 1 1.6 2.2 2.8 2.1 1.1 0 1.5-.7 2.9-.7s1.7.7 2.9.7c1.2 0 2-1 2.7-2.1.9-1.2 1.2-2.4 1.2-2.5-.1 0-2.9-1.1-2.9-4.3zM11 3.2c.6-.7 1-1.7.9-2.7-.9 0-1.9.6-2.5 1.3-.5.6-1 1.6-.9 2.6 1 .1 1.9-.5 2.5-1.2z"/></svg>
        Continue with Apple
      </button>
    </div>
    <div class="divider-row">or use email</div>

    <!-- SIGN IN -->
    <form id="signin-form">
      <div class="field">
        <label for="signin-email">Email</label>
        <input type="email" id="signin-email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="signin-password">Password</label>
        <input type="password" id="signin-password" required autocomplete="current-password">
      </div>
      <a href="#" class="forgot-link" id="forgot-link">Forgot password?</a>
      <button type="submit" class="btn btn-primary btn-block" id="signin-submit">Log in</button>
    </form>

    <!-- SIGN UP -->
    <form id="signup-form" class="hidden">
      <div class="field">
        <label for="signup-name">Full name</label>
        <input type="text" id="signup-name" required autocomplete="name">
      </div>
      <div class="field">
        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" required minlength="8" autocomplete="new-password">
        <div class="field-hint">At least 8 characters.</div>
      </div>
      <div class="field">
        <label for="signup-confirm">Confirm password</label>
        <input type="password" id="signup-confirm" required minlength="8" autocomplete="new-password">
        <div class="field-error" id="confirm-error">Passwords don't match.</div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="signup-submit">Create account</button>
    </form>

    <p class="text-center mt-24" style="font-size:0.85rem;">By continuing you agree to our <a href="legal/terms.html" style="text-decoration:underline;">Terms</a> and <a href="legal/privacy.html" style="text-decoration:underline;">Privacy Policy</a>.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/components.js"></script>
<script src="js/auth.js"></script>
<script>renderPublicNav("login");</script>
</body>
</html>
