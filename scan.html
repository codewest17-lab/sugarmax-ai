<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#059669">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Scan a meal — SugarMax AI</title>
<link rel="stylesheet" href="css/styles.css?v=5">
</head>
<body>
<div id="nav-root"></div>

<div class="container-narrow section">
  <h1 style="font-size:1.9rem;">Scan your meal</h1>
  <p id="scans-left-note" class="muted">Loading your scan balance…</p>

  <div id="alert-box"></div>

  <div id="upload-stage">
    <div class="dropzone" id="dropzone">
      <div id="dropzone-empty">
        <p style="font-weight:700;color:var(--ink);margin-bottom:6px;">Drop a photo, or tap to choose one</p>
        <p class="field-hint">JPG or PNG, up to 8MB</p>
      </div>
      <img id="preview-img" class="preview" style="display:none;">
      <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" capture="environment" style="display:none;">
    </div>
    <button class="btn btn-primary btn-block mt-24" id="analyze-btn" disabled>Analyze meal</button>
  </div>

  <div id="scanning-stage" style="display:none;">
    <div class="scan-mock">
      <div class="scan-mock-photo">
        <div class="scan-corner tl"></div>
        <div class="scan-corner tr"></div>
        <div class="scan-corner bl"></div>
        <div class="scan-corner br"></div>
        <img id="scan-photo" alt="Your meal">
        <div class="scan-grid-overlay"></div>
        <div class="scanline"></div>
        <div class="scan-hud"><span class="ai-dot"></span><span id="scan-status-text">Reading your plate…</span></div>
      </div>
    </div>
    <p class="muted text-center mt-16">This takes a few seconds — hang tight.</p>
  </div>
</div>

<div id="footer-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/components.js?v=4"></script>
<script src="js/scan.js"></script>
<script>renderAppNav("scan"); renderFooter();</script>
<script src="js/pwa.js" defer></script>
</body>
</html>
