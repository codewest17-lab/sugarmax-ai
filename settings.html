<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — SugarMax AI</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="nav-root"></div>

<div class="container-narrow section">
  <h1 style="font-size:1.9rem;">Settings</h1>
  <div id="alert-box"></div>

  <div class="card mt-16">
    <h3 style="font-size:1rem;">Profile</h3>
    <form id="profile-form">
      <div class="field mt-16">
        <label for="full-name">Full name</label>
        <input type="text" id="full-name">
      </div>
      <div class="field">
        <label for="email-display">Email</label>
        <input type="email" id="email-display" disabled>
      </div>
      <button type="submit" class="btn btn-primary" id="save-profile-btn">Save changes</button>
    </form>
  </div>

  <div class="card mt-16">
    <h3 style="font-size:1rem;">Subscription</h3>
    <p id="sub-detail" class="mt-0">Loading…</p>
    <a href="pricing.html" class="btn btn-outline" id="manage-sub-btn">Manage plan</a>
  </div>

  <div class="card mt-16">
    <h3 style="font-size:1rem;">Change password</h3>
    <form id="password-form">
      <div class="field mt-16">
        <label for="new-pw">New password</label>
        <input type="password" id="new-pw" minlength="8">
      </div>
      <button type="submit" class="btn btn-outline">Update password</button>
    </form>
  </div>

  <div class="card mt-16" style="border-color:var(--alert);">
    <h3 style="font-size:1rem;color:var(--alert);">Delete account</h3>
    <p class="mt-0">This permanently deletes your account, scans, and history. <a href="legal/data-deletion.html" style="text-decoration:underline;">Learn more</a> or email support to proceed.</p>
    <a href="legal/data-deletion.html" class="btn btn-outline">Request data deletion</a>
  </div>
</div>

<div id="footer-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/components.js"></script>
<script src="js/settings.js"></script>
<script>renderAppNav("settings"); renderFooter();</script>
</body>
</html>
