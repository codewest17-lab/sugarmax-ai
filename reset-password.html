<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — SugarMax AI</title>
<link rel="stylesheet" href="css/styles.css">
<style>.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}.card-w{max-width:400px;width:100%;}</style>
</head>
<body>
<div class="wrap">
  <div class="card-w">
    <h1 style="font-size:1.6rem;">Set a new password</h1>
    <div id="alert-box"></div>
    <form id="reset-form">
      <div class="field">
        <label for="new-password">New password</label>
        <input type="password" id="new-password" minlength="8" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="reset-submit">Update password</button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script>
function showAlert(msg, type = "error") {
  document.getElementById("alert-box").innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
}
document.getElementById("reset-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("reset-submit");
  btn.disabled = true; btn.textContent = "Updating…";
  const password = document.getElementById("new-password").value;
  const { error } = await supabaseClient.auth.updateUser({ password });
  if (error) {
    showAlert(error.message);
    btn.disabled = false; btn.textContent = "Update password";
    return;
  }
  showAlert("Password updated. Redirecting…", "success");
  setTimeout(() => window.location.href = "dashboard.html", 1200);
});
</script>
</body>
</html>
